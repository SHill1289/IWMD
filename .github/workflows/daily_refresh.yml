name: IWMD Daily Market Refresh

on:
  workflow_dispatch:

  schedule:
    - cron: "15 18 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  refresh-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh IWMD market data
        run: python refresh_market_data.py

      - name: Commit updated market data
        run: |
          git config user.name "IWMD Data Bot"
          git config user.email "actions@github.com"

          git add data/parquet/

          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Daily IWMD market data refresh"
            git push
          fi